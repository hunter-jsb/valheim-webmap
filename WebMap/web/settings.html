<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
<title>Valheim WebMap</title>
<meta name="description" content="The map mod's settings, for the server's admins.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪓</text></svg>">
<link rel="stylesheet" href="site.css">
<script src="site-config.js"></script>
<script src="map-core.js"></script>
<style>
  body{min-height:100%}
  .wrap{max-width:820px;padding-top:1.4rem}
  .rows{gap:.6rem;margin-top:.4rem}
  .rows .section{margin-top:.9rem}
  /* one setting: its name and what it does, the value, and who set it */
  .set{display:grid;grid-template-columns:minmax(0,1fr) 12rem;gap:.5rem 1rem;align-items:start}
  .set .k{font-family:var(--mono);font-size:.82rem;color:var(--bright);font-weight:600}
  .set .k .tag{font-family:var(--font);font-weight:500;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;margin-left:.5rem;color:var(--muted)}
  .set .k .tag.restart{color:var(--gold)}
  .set .d{font-size:.76rem;color:var(--muted);margin-top:.2rem;line-height:1.45}
  .set .who{font-size:.68rem;color:var(--faint);margin-top:.25rem}
  .set .who b{color:var(--muted);font-weight:500}
  .set form{display:grid;gap:.35rem}
  .set .field{font-family:var(--mono);font-size:.82rem}
  .set .btnrow .btn{height:30px;min-width:0;padding:0 .55rem;font-size:.74rem}
  .set .note{margin-top:0}
  #restart{margin-top:.8rem}
  @media (max-width:560px){ .set{grid-template-columns:1fr} }
</style>
</head>
<body>
<nav class="nav" data-page="settings"></nav>
<script>MapCore.nav();</script>
<main class="wrap">
  <h1 class="title">Settings</h1>
  <p class="sub" id="sub">The map mod's settings, kept by the server. Changes apply at once unless marked, and every change is posted to the Discord.</p>
  <p class="note bad" id="note"></p>
  <div class="card" id="restart" hidden><b>A restart is due.</b> <span class="note">A setting marked <em>restart</em> has changed; it takes effect when the server next restarts.</span></div>
  <div class="rows" id="rows"></div>
  <p class="foot"><span id="stamp"></span><span class="credits"> · <a class="repo" href="https://github.com/hunter-jsb/xn-valheim">state-as-code</a></span></p>
</main>

<script>
const API = MapCore.cfg.api, esc = MapCore.esc;
MapCore.fetchConfig(API).catch(() => {});
let SETTINGS = null;

function row(s){
  // a moment the server stamps as its own now: sign_out_before, one button and no reset
  const time = s.kind === "time";
  const input = time
    ? `<input type="hidden" name="value" value="now"><div class="note">${+s.value ? "Sessions from before " + esc(new Date(s.value * 1000).toLocaleString()) + " are refused." : "No sessions refused yet."}</div>`
    : s.kind === "bool"
    ? `<select class="field" name="value"><option value="true"${s.value === "true" ? " selected" : ""}>true</option><option value="false"${s.value === "false" ? " selected" : ""}>false</option></select>`
    : `<input class="field" name="value" value="${esc(s.secret ? "" : s.value)}" placeholder="${esc(s.secret ? (s.set ? "set · paste a new one to replace it" : "not set") : s.default)}" autocomplete="off"${s.secret ? ' type="password"' : ""}>`;
  return `<div class="card set" data-key="${esc(s.key)}">
    <div><div class="k">${esc(s.key)}<span class="tag${s.live ? "" : " restart"}">${s.live ? "live" : "restart"}</span></div>
      <div class="d">${esc(s.desc)}</div>
      <div class="who">${s.given ? `set by <b>${esc(s.by || "someone")}</b> ${s.t ? MapCore.secsAgo(s.t) : ""} · the config says ${esc(s.secret ? (s.default ? "set" : "nothing") : s.default || "nothing")}` : "the config's own value"}</div></div>
    <form><div>${input}</div><div class="btnrow"><button class="btn" type="submit">${time ? "Sign everyone out" : "Save"}</button>${s.given && !time ? '<button class="btn quiet" type="button" data-reset title="Back to the config file\'s value">Reset</button>' : ""}</div><div class="note" data-note></div></form>
  </div>`;
}
// the settings read in groups, as an admin thinks of them, not in the file's order
const GROUPS = [
  ["The map", ["explore_radius", "update_fog_texture_interval", "save_fog_texture_interval", "texture_size", "pixel_size", "render_size", "default_zoom"]],
  ["Players", ["player_update_interval", "always_map", "always_visible", "show_vehicles", "max_pins_per_user"]],
  ["Sign-in", ["discord_guild", "discord_admin_role", "public_url", "sign_out_before"]],
  ["Chat & Discord", ["max_messages", "announce_name", "discord_webhook", "discord_bot_token", "discord_log_channel", "discord_chat_channel", "chat_relay"]],
  ["The 3D view", ["export_models", "extract_textures", "extract_meshes", "export_ms_per_frame", "texture_max_size", "object_categories"]],
  ["The mod", ["debug"]],
];
function render(){
  const by = new Map(SETTINGS.settings.map(s => [s.key, s]));
  const placed = new Set();
  let html = "";
  for(const [title, keys] of GROUPS){
    const rows = keys.map(k => by.get(k)).filter(Boolean);
    if(!rows.length) continue;
    rows.forEach(s => placed.add(s.key));
    html += `<h2 class="eyebrow section">${esc(title)}</h2>` + rows.map(row).join("");
  }
  const rest = SETTINGS.settings.filter(s => !placed.has(s.key));   // a newer mod's settings this page has not sorted yet
  if(rest.length) html += `<h2 class="eyebrow section">More</h2>` + rest.map(row).join("");
  document.getElementById("rows").innerHTML = html;
  document.getElementById("restart").hidden = !SETTINGS.restart;
  upgradePickers();
}

// The guild and channel fields get a <select> once a token is set and the picker
// answers; a fresh field, or one that fails to load, just keeps the plain input.
const CHANNEL_KEYS = ["discord_log_channel", "discord_chat_channel"];
function fillPicker(key, options, current){
  const card = document.querySelector(`.set[data-key="${key}"] .field`);
  if(!card || !options.length) return;
  const sel = document.createElement("select");
  sel.className = "field"; sel.name = "value";
  sel.innerHTML = `<option value="">— none —</option>` + options.map(o =>
    `<option value="${esc(o.id)}"${o.id === current ? " selected" : ""}>${esc(o.name)}</option>`).join("");
  card.replaceWith(sel);
}
async function upgradePickers(){
  const tokenRow = SETTINGS.settings.find(s => s.key === "discord_bot_token");
  const guildRow = SETTINGS.settings.find(s => s.key === "discord_guild");
  if(!tokenRow || !tokenRow.set || !guildRow) return;   // no token yet: nothing to pick from
  // a list the server refuses is an empty one; no answer at all leaves the plain fields
  const refused = e => { if(e.status) return {}; throw e; };
  try{
    const guilds = (await MapCore.fetchJSON(API, "/discord/guilds", {headers: MapCore.authHeaders()}).catch(refused)).guilds || [];
    fillPicker("discord_guild", guilds, guildRow.value);
    const guildId = guildRow.value || (guilds[0] && guilds[0].id) || "";
    if(!guildId) return;
    const channels = (await MapCore.fetchJSON(API, "/discord/channels?guild=" + encodeURIComponent(guildId), {headers: MapCore.authHeaders()}).catch(refused)).channels || [];
    for(const key of CHANNEL_KEYS){
      const row = SETTINGS.settings.find(s => s.key === key);
      if(row) fillPicker(key, channels, row.value);
    }
  }catch(e){ /* the plain fields still work */ }
}
async function load(){
  const me = await MapCore.whoami();
  const note = document.getElementById("note"), rows = document.getElementById("rows");
  if(!me){ note.textContent = "Sign in with Discord to see the settings."; rows.innerHTML = ""; return; }
  if(!me.admin){ note.textContent = "The settings are for the server's admins."; rows.innerHTML = ""; return; }
  try{
    SETTINGS = await MapCore.fetchJSON(API, "/settings", {headers: MapCore.authHeaders()}); note.textContent = ""; render();
    document.getElementById("stamp").textContent = "read " + new Date().toLocaleTimeString();
  }catch(e){ note.textContent = e.message === "HTTP 404" ? "This server does not take settings from the site yet (it needs the mod build that does)." : e.message; }
}
document.getElementById("rows").addEventListener("submit", async e => {
  e.preventDefault();
  const card = e.target.closest(".set"), key = card.dataset.key, n = card.querySelector("[data-note]");
  n.className = "note"; n.textContent = "saving…";
  try{
    const r = await MapCore.post(API, "/settings", {key, value: e.target.value.value});
    SETTINGS = r.settings; render();
    if(r.restart) document.getElementById("restart").hidden = false;
    // this admin's session went with everyone's (one a proxy signed stays: it is the proxy's)
    if(key === "sign_out_before" && !await MapCore.whoami()){
      const note = document.getElementById("note");
      document.getElementById("rows").innerHTML = "";
      note.className = "note"; note.textContent = "Everyone is signed out, you too. Sign in again to come back here.";
    }
  }catch(err){ n.className = "note bad"; n.textContent = err.message || "could not save"; }
});
document.getElementById("rows").addEventListener("click", async e => {
  const b = e.target.closest("[data-reset]"); if(!b) return;
  const card = b.closest(".set"), n = card.querySelector("[data-note]");
  n.className = "note"; n.textContent = "resetting…";
  try{ const r = await MapCore.post(API, "/settings", {key: card.dataset.key, value: ""}); SETTINGS = r.settings; render(); }
  catch(err){ n.className = "note bad"; n.textContent = err.message || "could not reset"; }
});
load();
</script>
</body>
</html>
