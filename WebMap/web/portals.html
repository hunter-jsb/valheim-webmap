<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
<title>Valheim WebMap</title>
<meta name="description" content="A live map of a Valheim server: builds, forest, portals, boats and players.">
<meta property="og:title" content="Valheim WebMap">
<meta property="og:description" content="A live map of a Valheim server: builds, forest, portals, boats and players.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪓</text></svg>">
<link rel="stylesheet" href="site.css">
<script src="site-config.js"></script>
<script src="map-core.js"></script>
<style>
  /* ---------- the lists ---------- */
  .key{color:var(--muted);font-size:.72rem;margin-top:.5rem}
  .key .k{display:inline-block;width:20px;border-top:2px solid var(--portal);vertical-align:middle;margin-right:.15rem}
  .key .k.dash{border-top:2px dashed #97c4d0;opacity:.75}
  .list{margin-top:.4rem}
  h2{margin-bottom:.55rem}
  .rows{display:grid;gap:.5rem}
  .row{display:flex;gap:.75rem;align-items:flex-start}
  .row .ic,.card h3 .ic{width:19px;height:19px;flex:0 0 auto;margin-top:.15rem;overflow:visible;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))}
  .bd{min-width:0;flex:1}
  .nm{font-size:.9rem;font-weight:600;color:var(--bright);display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem}
  .nm .arr{color:var(--portal);font-weight:400;font-size:1.05rem;line-height:1}
  .nm .un{color:var(--muted);font-weight:400;font-style:italic}
  /* the coordinates are the point of the row: readable, but the name leads */
  .ends{margin-top:.25rem;display:grid;gap:.1rem;font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .ends .xz,.meta .xz{color:var(--ink-2)}
  /* a hub's card: its name, where it stands, then a row per spoke */
  .card{margin-bottom:.8rem}
  .card h3{font-size:.92rem;font-weight:600;color:var(--bright);display:flex;gap:.6rem;align-items:flex-start}
  .meta{color:var(--muted);font-size:.74rem;margin-top:.15rem;font-variant-numeric:tabular-nums}
  .spokes{list-style:none;display:grid;gap:.2rem;margin-top:.55rem;border-top:1px solid var(--line);padding-top:.55rem}
  .spokes a{display:flex;flex-wrap:wrap;gap:.4rem;align-items:baseline;color:var(--muted);
    font-size:.78rem;padding:.2rem .3rem;border-radius:var(--r-sm);font-variant-numeric:tabular-nums}
  .spokes a:hover{background:var(--card-2);text-decoration:none}
  .spokes .g{color:var(--bright);font-weight:600}
  .spokes .arr{color:var(--portal)}
  .spokes .to{color:var(--ink)}
  .spokes .st{margin-left:auto;font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
  .spokes .on{color:var(--portal)}
  .spokes .dial{color:var(--unknown)}
  /* many gates read by direction: a sector's rows under its heading, nearest first */
  .sector{font-size:.62rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
    margin:.45rem 0 .1rem;display:flex;gap:.4rem;align-items:baseline}
  .sector:first-child{margin-top:0}
  .sector b{color:var(--muted)}
  .spokes li.hid{display:none}
  .find{margin:.5rem 0 .15rem}
  .find .field{font-size:.78rem;padding:.3rem .45rem}
  #hubs{margin:.55rem 0 .2rem}
  #hubs .chip .n{color:var(--faint);font-weight:400;margin-left:.3rem}
  /* renaming a hub happens in its own title */
  .card h3 .edit{color:var(--faint);font-size:.8rem;text-decoration:none;margin-left:.15rem;align-self:baseline}
  .card h3 .edit:hover{color:var(--gold)}
  .card h3 .tags{display:block;font-weight:400;font-size:.72rem;color:var(--muted);margin-top:.1rem}
  .rename{display:grid;gap:.4rem;margin:.2rem 0 .4rem}
  .rename .field{font-size:.85rem}

  /* ---------- the diagram ---------- */
  /* Screen-space canvas, HTML nodes placed by left/top: nothing crisp ever sits
     under a CSS transform, which is the map's own rule. */
  .stage{background:#05070a}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  .net{position:absolute;inset:0;pointer-events:none}
  .node{position:absolute;width:0;height:0;pointer-events:none;color:var(--ink);text-decoration:none}
  .node .ic,.node .lb,.node .panel{pointer-events:auto}
  .node .ic{position:absolute;left:-11px;top:-11px;width:22px;height:22px;overflow:visible;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.85))}
  .node .lb{position:absolute;display:block;white-space:nowrap;text-align:center;line-height:1.2}
  .node .t{display:block;font-size:.8rem;font-weight:700;color:var(--bright);
    text-shadow:0 1px 3px #000,0 0 6px #000,0 0 6px #000}
  .node .d{display:block;font-size:.68rem;color:#a7b6bd;font-variant-numeric:tabular-nums;
    text-shadow:0 1px 3px #000,0 0 6px #000}
  .node .dl{color:var(--unknown);font-weight:600}
  .node.dial .ic{opacity:.66}
  .node.loose .ic{opacity:.3}
  .node.mini .lb{display:none}          /* no room at this zoom: the icon keeps the place */
  .node.off{display:none}
  .node:hover .t,.node.hl .t{color:var(--portal)}
  .node:hover .ic,.node.hl .ic{filter:drop-shadow(0 0 6px rgba(111,216,230,.95));opacity:1}
  /* a hub is a panel, not a dot: its name, its gate count, one gate chip each */
  .node.hub{z-index:2}
  /* the panel's containing block is a zero-width anchor: say max-content or every
     gate wraps onto its own line */
  .panel{position:absolute;width:max-content;min-width:108px;max-width:200px;background:rgba(14,21,24,.9);
    border:1px solid #3a5a65;border-radius:var(--r);padding:.4rem .45rem .45rem;box-shadow:0 3px 16px rgba(0,0,0,.65)}
  .panel .ttl{display:flex;gap:.5rem;align-items:baseline}
  .panel .ttl a{font-size:.84rem;font-weight:700;color:var(--bright);letter-spacing:.01em}
  .panel .ttl a:hover{color:var(--portal);text-decoration:none}
  .panel .ttl .n{margin-left:auto;font-size:.68rem;font-weight:600;color:var(--muted);white-space:nowrap}
  .gates{display:flex;flex-wrap:wrap;gap:.22rem;margin-top:.38rem}
  .gate{font-size:.7rem;font-weight:600;line-height:1;padding:.25rem .38rem;border-radius:var(--r-sm);
    border:1px solid transparent;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .gate.on{background:rgba(111,216,230,.14);border-color:rgba(111,216,230,.5);color:#bdf1f8}
  .gate.free{background:#1b211f;border-color:#39423c;color:var(--muted)}
  .gate:hover,.gate.hl{background:var(--portal);border-color:var(--portal);color:#06282d;text-decoration:none}
  /* a big hub shows the gates you can act on; the linked ones fold behind a count */
  .panel.big .gate.on{display:none}
  .panel.big.open .gate.on{display:inline-block}
  .gate.sum{background:transparent;border-color:#3a5a65;color:#8fb5c0;cursor:pointer}
  .panel.big.open .gate.sum{color:var(--bright)}
  /* out of the picked hub's reach: still there, but faint */
  .node.dim{opacity:.35}
  .node.dim .panel{opacity:.55}
  .rose,.sbar{position:absolute;left:.65rem;color:var(--muted);font-size:.68rem;letter-spacing:.06em;text-shadow:0 1px 3px #000}
  .rose{top:.5rem;font-weight:600}
  .sbar{bottom:.5rem;display:flex;align-items:flex-end;gap:.35rem}
  .sline{display:block;height:5px;border:1px solid #8b968f;border-top:0}
  /* a phone's whole diagram is 3 km across: a panel that stays desktop-wide would
     swallow the places nearest the hub */
  @media (max-width:560px){
    .panel{max-width:150px;padding:.35rem .4rem .4rem}
    .panel .ttl a{font-size:.78rem}
    .gate{font-size:.66rem;padding:.2rem .32rem}
    .node .t{font-size:.76rem}
  }
</style>
</head>
<body>

<svg id="icons" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"></svg>
<script>MapCore.injectSprite(document.getElementById("icons"));</script>

<nav class="nav" data-page="portals" data-side></nav>
<script>MapCore.nav();</script>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <button class="sideclose" type="button" aria-label="Close">&times;</button>
    <h1 class="title">Portals</h1>
    <p class="sub" id="count">reading the world&#8230;</p>
    <p class="note bad" id="note"></p>
    <p class="key"><span class="k"></span> a standing link &#183; <span class="k dash"></span> one retag away
      &#183; drag to pan, scroll or pinch to zoom</p>
    <div class="btnrow" id="hubs" hidden></div>
    <div class="list" id="list"></div>
    <p class="foot"><span id="stamp"></span> &#183; a node opens the map on that portal<span class="credits"> &#183;
      <a class="repo" href="https://github.com/hunter-jsb/xn-valheim">state-as-code</a></span></p>
  </aside>

  <!-- the rows beside it say all of this in text: to a screen reader the diagram is
       decoration, so nothing in it is reachable by tab -->
  <div class="stage" id="stage" aria-hidden="true">
    <canvas id="cv"></canvas>
    <div class="net" id="net"></div>
    <div class="rose">N &#8593;</div>
    <div class="mapctl top"><button class="btn map" id="fitBtn" type="button" tabindex="-1" title="Fit every portal">&#8962;</button></div>
    <div class="sbar"><span class="sline" id="scaleBar"></span><span id="scaleTxt"></span></div>
  </div>
</div>

<script>
const API = MapCore.cfg.api;
const SITE_R = 80;    // portals this close stand at one place
const PIN_R  = 120;   // a house pin this close gives that place its name
const ZMAX   = 6;     // two sites are 80 m apart at the closest: past this there is nothing left to separate
const esc = MapCore.esc, GEOM = MapCore.geom;
const clamp = MapCore.clamp;
let WORLD = "", PINS = [], NAMED = [], LAST = "", LAST_HEAD = "", LAST_NET = "";
let FOCUS = null, EDITING = null, HUBS = [];           // the hub picked in the chips; a hub whose name is being typed
const FILTER = new Map();                              // a big hub's search text, by hub id
const HUB_R = 150;                                     // a hub's name, or a gate's memory, counts this close
const hubId = s => `hub@${Math.round(s.x)},${Math.round(s.z)}`;

const plural = MapCore.plural;

// Valheim's +z is north, +x east, and a lone distance is from the world centre --
// which is where everyone spawns, so it is the shared frame of reference.
const DIRS = ["north","north-east","east","south-east","south","south-west","west","north-west"];
const ABBR = ["N","NE","E","SE","S","SW","W","NW"];
function deg(dx, dz){ return (Math.atan2(dx, dz)*180/Math.PI + 360) % 360; }
function bearing(dx, dz){ return DIRS[Math.round(deg(dx, dz)/45) % 8]; }
function abbr(dx, dz){ return ABBR[Math.round(deg(dx, dz)/45) % 8]; }
function span(d){ return d < 1000 ? Math.round(d) + " m" : (d/1000).toFixed(1) + " km"; }
function where(p){
  const d = Math.hypot(p.x, p.z), xz = `${Math.round(p.x)}, ${Math.round(p.z)}`;
  return `<span class="xz">${xz}</span> &#183; ` + (d < 50 ? "the world centre" : `${bearing(p.x, p.z)}, ${span(d)}`);
}
function nameOf(p){ return p.name ? esc(p.name) : `<span class="un">unnamed</span>`; }
function link(id){ return `index.html#portal=${encodeURIComponent(id)}`; }
// Either end serves as the link target: the map fits the whole pair anyway.
function row(ends){
  return `<a class="card link row" href="${link(ends[0].id)}">`
    + `<svg class="ic"><use href="#ic-portal"></use></svg><div class="bd">`
    + `<div class="nm">${ends.map(nameOf).join('<span class="arr">&#8596;</span>')}</div>`
    + `<div class="ends">${ends.map(e => `<span>${where(e)}</span>`).join("")}</div>`
    + `</div></a>`;
}

// ---------- sites ----------
// Portals within 80 m of one another stand at the same place; the chain is
// single-link, so a strung-out base still reads as one site.
function cluster(list){
  const up = list.map((_, i) => i);
  const find = i => up[i] === i ? i : (up[i] = find(up[i]));
  for(let i = 0; i < list.length; i++) for(let j = i+1; j < list.length; j++)
    if(Math.hypot(list[i].x-list[j].x, list[i].z-list[j].z) <= SITE_R){
      const a = find(i), b = find(j); if(a !== b) up[a] = b;
    }
  const by = new Map();
  list.forEach((p, i) => { const r = find(i); (by.get(r) || by.set(r, []).get(r)).push(p); });
  return [...by.values()].map(portals => {
    const x = portals.reduce((t, p) => t+p.x, 0)/portals.length;
    const z = portals.reduce((t, p) => t+p.z, 0)/portals.length;
    const nm = siteName(portals), q = MapCore.toPx(x, z);
    return {portals, x, z, px: q.px, py: q.py, pin: nm.pin, label: nm.label, given: nm.given, by: nm.by, tags: nm.tags};
  });
}
// A name given on the site wins; then a house pin standing in the place; failing
// both the portals name themselves by their tags, which is what players say out loud.
function siteName(portals){
  const cx = portals.reduce((t, p) => t+p.x, 0)/portals.length, cz = portals.reduce((t, p) => t+p.z, 0)/portals.length;
  let given = null, gd = HUB_R;
  for(const nm of NAMED){
    const d = Math.hypot(nm.x-cx, nm.z-cz);
    if(d < gd){ gd = d; given = nm; }
  }
  const tags = [...new Set(portals.map(p => p.name).filter(Boolean))]
    .sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
  if(given) return {pin: given.name, label: given.name, given: given.name, by: given.by, tags};
  let best = null, bd = PIN_R;
  for(const pin of PINS){
    if(pin.type !== "house" || !pin.text) continue;
    for(const p of portals){
      const d = Math.hypot(pin.x-p.x, pin.z-p.z);
      if(d < bd){ bd = d; best = pin; }
    }
  }
  if(best) return {pin: best.text, label: best.text, given: null, by: null, tags};
  return {pin: null, label: tags.length ? tags.join(" · ") : "unnamed site", given: null, by: null, tags};
}

// ---------- the diagram ----------
// The world as a reference chart with the network over it: the same screen-space
// view maths as the map and the planning board, so a pan is a pan everywhere.
const stage = document.getElementById("stage");
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const net = document.getElementById("net");
const LAY = MapCore.layers(API, () => draw());
let scratch = null, sctx = null;
let NODES = [], SPOKES = [], SPOKE = new Map(), BBOX = null, HOVER = new Set(), FITTED = false;
// the window onto the chart; a touch is the only hover a phone has, so a press sets it
const V = MapCore.view(stage, {paint, max: ZMAX, min: .4, guard: ".mapctl", capture: false,
  down: e => { setHover(keysOf(e.target)); }, resize: () => { if(NODES.length) measure(); }});
function draw(){ V.request(); }

function sizeCanvas(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const W = Math.round(stage.clientWidth*dpr), H = Math.round(stage.clientHeight*dpr);
  if(cv.width !== W || cv.height !== H){ cv.width = W; cv.height = H; }
  if(!scratch){ scratch = document.createElement("canvas"); sctx = scratch.getContext("2d"); }
  if(scratch.width !== W || scratch.height !== H){ scratch.width = W; scratch.height = H; }
  return dpr;
}
// The server's chart -- each pixel its biome's flat colour, water one blue -- with
// the fog over it, so the network sits on matte ground. Until the server has a
// chart, the map's own render is filtered grey and cool instead.
function paint(){
  const pix = sizeCanvas(), W = stage.clientWidth, H = stage.clientHeight;
  const v = {scale: V.scale, tx: V.tx, ty: V.ty, w: W, h: H, pix};
  if(LAY.ready("chart")){
    MapCore.drawRasters(ctx, v, {base: LAY.imgs.chart, fog: LAY.imgs.fog}, {bg: "#05070a"});
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }else{
    MapCore.drawRasters(sctx, v, LAY.imgs, {bg: "#05070a"});
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
    ctx.filter = "grayscale(.85) contrast(1.45) brightness(.74)";
    ctx.drawImage(scratch, 0, 0);
    ctx.filter = "none";
    ctx.globalCompositeOperation = "color";        // the land keeps its light, not its hue
    ctx.globalAlpha = .6;
    ctx.fillStyle = "#4b7ea8";
    ctx.fillRect(0, 0, cv.width, cv.height);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  layout(v);
  drawSpokes(v);
  drawLeads(v);
  scaleBar();
}

// Nodes are HTML at screen positions, so a chip is a real link and the text is
// never scaled. Two passes: the places claim their ground first -- an icon stands
// where the portal stands -- and the labels then compete for whatever air is left.
function layout(v){
  const W = stage.clientWidth, H = stage.clientHeight, EDGE = 180, PAD = 5, DRIFT = 74;
  const rects = [{x0: 0, y0: 0, x1: 78, y1: 26},          // the rose
                 {x0: W-46, y0: 0, x1: W, y1: 46},        // the fit button
                 {x0: 0, y0: H-26, x1: 250, y1: H}];      // the scale bar
  const over = (r, q) => r.x0 < q.x1+PAD && q.x0 < r.x1+PAD && r.y0 < q.y1+PAD && q.y0 < r.y1+PAD;
  const hits = r => rects.some(q => over(r, q));
  const boxAt = (n, ox, oy) => ({x0: n.sx+ox-n.w/2, y0: n.sy+oy-n.h/2,
                                 x1: n.sx+ox+n.w/2, y1: n.sy+oy+n.h/2});
  const put = (n, ox, oy) => {
    n.box.style.left = Math.round(ox - n.w/2) + "px";
    n.box.style.top  = Math.round(oy - n.h/2) + "px";
    n.rect = boxAt(n, ox, oy);
    n.lead = Math.hypot(ox, oy) > 34 ? {ox, oy} : null;
    rects.push(n.rect);
  };
  for(const n of NODES){
    n.sx = v.tx + n.site.px*v.scale;
    n.sy = v.ty + n.site.py*v.scale;
    n.vis = n.sx > -EDGE && n.sy > -EDGE && n.sx < W+EDGE && n.sy < H+EDGE;
    n.rect = null; n.lead = null;
    n.el.style.left = Math.round(n.sx) + "px";
    n.el.style.top  = Math.round(n.sy) + "px";
    n.el.classList.toggle("off", !n.vis);
    n.el.classList.remove("mini");
  }
  for(const n of NODES){                       // hubs first: a panel stands on its own ground
    if(!n.vis) continue;
    if(n.kind === "hub"){ if(n.w) put(n, 0, 0); continue; }
    const ic = {x0: n.sx-13, y0: n.sy-13, x1: n.sx+13, y1: n.sy+13};
    if(hits(ic)){ n.el.classList.add("off"); n.vis = false; continue; }  // a place already stands here
    rects.push(ic);
  }
  for(const n of NODES){
    if(!n.vis || n.kind === "hub" || !n.w) continue;
    // an icon off the edge keeps its spoke, but a label out there belongs to nothing
    if(n.sx < 0 || n.sy < 0 || n.sx > W || n.sy > H){ n.el.classList.add("mini"); continue; }
    const gy = 13 + PAD + n.h/2 + 1, gx = 13 + PAD + n.w/2 + 1;
    const reach = Math.abs(n.u.x)*n.w/2 + Math.abs(n.u.y)*n.h/2 + 14 + PAD;
    const cand = [[0, gy], [0, -gy], [n.u.x*reach, n.u.y*reach], [gx, 0], [-gx, 0]];
    // nothing beside the icon: step past whatever is in the way, up to a leader's length
    for(const dir of [1, -1]){
      let oy = dir*gy;
      for(let i = 0; i < 6; i++){
        const q = rects.find(r => over(boxAt(n, 0, oy), r));
        if(!q){ cand.push([0, oy]); break; }
        oy = (dir > 0 ? q.y1 + PAD + n.h/2 + 1 : q.y0 - PAD - n.h/2 - 1) - n.sy;
        if(Math.abs(oy) > DRIFT) break;
      }
    }
    let done = false;
    for(const c of cand){
      const ox = clamp(c[0], 6 + n.w/2 - n.sx, W - 6 - n.w/2 - n.sx);
      const oy = clamp(c[1], 6 + n.h/2 - n.sy, H - 6 - n.h/2 - n.sy);
      if(hits(boxAt(n, ox, oy))) continue;
      put(n, ox, oy); done = true; break;
    }
    if(!done) n.el.classList.add("mini");
  }
}
// a label that had to step away from its icon says which icon it belongs to
function drawLeads(v){
  const g = ctx;
  g.setTransform(v.pix, 0, 0, v.pix, 0, 0);
  g.setLineDash([]); g.lineWidth = 1; g.strokeStyle = "rgba(167,182,189,.5)";
  g.beginPath();
  for(const n of NODES){
    if(!n.vis || !n.lead) continue;
    const s = n.lead.oy >= 0 ? 1 : -1;
    g.moveTo(n.sx, n.sy + s*13);
    g.lineTo(n.sx + n.lead.ox, n.sy + n.lead.oy - s*n.h/2);
  }
  g.stroke();
}

// A spoke is the real line between two places: solid where the gates are linked,
// dashed where one retag would open it.
function drawSpokes(v){
  const g = ctx;
  g.setTransform(v.pix, 0, 0, v.pix, 0, 0);
  g.lineCap = "round";
  for(const s of SPOKES.slice().sort((a, b) => (HOVER.has(a.k)?1:0) - (HOVER.has(b.k)?1:0))){
    const A = s.a.node, B = s.b.node;
    if(!A || !B || (!A.vis && !B.vis)) continue;
    const dx = B.sx-A.sx, dy = B.sy-A.sy, len = Math.hypot(dx, dy) || 1;
    const u = {x: dx/len, y: dy/len};
    const p = edge(A, u, 1), q = edge(B, u, -1);
    const t0 = (p.x-A.sx)*u.x + (p.y-A.sy)*u.y;
    const t1 = len - Math.hypot(B.sx-q.x, B.sy-q.y);
    if(t1 - t0 < 4) continue;                  // the panel already covers the whole run
    const on = HOVER.has(s.k), dial = s.kind === "dial";
    const dim = FOCUS && s.a !== FOCUS && s.b !== FOCUS && !on;
    g.setLineDash(dial ? [6, 6] : []);
    g.lineWidth = dial ? (on ? 2.6 : 1.5) : (on ? 3.4 : 2.1);
    g.strokeStyle = on ? "#e4feff" : dim ? (dial ? "rgba(151,196,208,.18)" : "rgba(111,216,230,.22)") : dial ? "rgba(151,196,208,.62)" : "rgba(111,216,230,.85)";
    g.shadowColor = "rgba(111,216,230,.85)";
    g.shadowBlur = on ? 12 : dim ? 0 : 4;
    g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(q.x, q.y); g.stroke();
  }
  g.shadowBlur = 0; g.setLineDash([]);
}
// leave from the panel's edge, or from just clear of the icon
function edge(n, u, sgn){
  const d = {x: u.x*sgn, y: u.y*sgn}, r = n.kind === "hub" ? n.rect : null;
  let t = 13;
  if(r && n.sx > r.x0 && n.sx < r.x1 && n.sy > r.y0 && n.sy < r.y1){
    t = Infinity;
    if(d.x >  1e-6) t = Math.min(t, (r.x1 + 3 - n.sx)/d.x);
    if(d.x < -1e-6) t = Math.min(t, (r.x0 - 3 - n.sx)/d.x);
    if(d.y >  1e-6) t = Math.min(t, (r.y1 + 3 - n.sy)/d.y);
    if(d.y < -1e-6) t = Math.min(t, (r.y0 - 3 - n.sy)/d.y);
  }
  return {x: n.sx + d.x*t, y: n.sy + d.y*t};
}
function scaleBar(){
  const mpp = GEOM.pixel/V.scale;               // metres per screen pixel
  let m = 10;
  while(m/mpp < 60) m *= m.toString()[0] === "1" ? 2.5 : 2;
  while(m/mpp > 150) m /= m.toString()[0] === "2" ? 2 : 2.5;
  document.getElementById("scaleBar").style.width = Math.round(m/mpp) + "px";
  document.getElementById("scaleTxt").textContent = m >= 1000 ? (m/1000) + " km" : Math.round(m) + " m";
}
// A label's size never changes with the zoom, so it is measured once per rebuild.
function measure(){
  for(const n of NODES){
    n.el.classList.remove("mini", "off");
    n.box = n.el.querySelector(".panel") || n.el.querySelector(".lb");
    n.w = n.box ? n.box.offsetWidth : 0;
    n.h = n.box ? n.box.offsetHeight : 0;
  }
}

// ---------- the view ----------
// a box of sites on screen, with room around the edge for the labels
function fitPx(b){
  V.computeFit();
  const W = stage.clientWidth, H = stage.clientHeight, m = Math.min(84, W*0.12, H*0.12);
  const bw = Math.max(b.x1-b.x0, 6), bh = Math.max(b.y1-b.y0, 6);
  V.scale = clamp(Math.min((W-2*m)/bw, (H-2*m)/bh), V.fit*0.4, ZMAX);
  V.tx = W/2 - (b.x0 + bw/2)*V.scale; V.ty = H/2 - (b.y0 + bh/2)*V.scale;
  draw();
}
function fitAll(){ if(BBOX) fitPx(BBOX); else V.fitWorld(); }
// a drag that began on a node is a pan, not a click through to the map
net.addEventListener("click", e => { if(V.moved > 6) e.preventDefault(); });
stage.addEventListener("pointermove", e => { if(!e.buttons) setHover(keysOf(e.target)); });
stage.addEventListener("pointerleave", () => setHover([]));
document.getElementById("fitBtn").onclick = fitAll;

const keysOf = el => { const t = el && el.closest && el.closest("[data-s]"); return t ? t.dataset.s.split(" ").filter(Boolean) : []; };
// one spoke lit, and both the places it joins
function setHover(keys){
  const s = new Set(keys);
  if(s.size === HOVER.size && [...s].every(k => HOVER.has(k))) return;
  HOVER = s;
  net.querySelectorAll(".hl").forEach(el => el.classList.remove("hl"));
  for(const k of HOVER){
    const sp = SPOKE.get(k); if(!sp) continue;
    for(const site of [sp.a, sp.b]) if(site.node) site.node.el.classList.add("hl");
    net.querySelectorAll('[data-s~="' + k + '"]').forEach(el => el.classList.add("hl"));
  }
  draw();
}

// ---------- the hub, as a node and as rows ----------
// The panel shows the gates you can do something with -- free, or tagged and
// waiting -- and folds the linked ones behind a count once there are many.
function panel(site, sps){
  const rank = g => { const i = sps.findIndex(s => s.gate === g); return i < 0 ? 900 : i; };
  const chip = g => {
    const s = sps.find(x => x.gate === g);
    return `<a class="gate ${s ? "on" : "free"}" href="${link(g.id)}" tabindex="-1"`
      + (s ? ` data-s="${s.k}"` : "") + `>${esc(g.name || (s ? "untagged" : "free"))}</a>`;
  };
  const gates = site.portals.slice().sort((a, b) => rank(a) - rank(b));
  const linked = gates.filter(g => sps.some(x => x.gate === g)).length, big = gates.length > 6;
  const sum = big ? `<a class="gate sum" tabindex="-1" title="Show or hide the linked gates">${linked} linked</a>` : "";
  return `<div class="panel${big ? " big" : ""}"><div class="ttl">`
    + `<a href="${link(site.portals[0].id)}" tabindex="-1">${site.pin ? esc(site.pin) : "Hub"}</a>`
    + `<span class="n">${plural(site.portals.length, "gate")}</span></div>`
    + `<div class="gates">${gates.filter(g => !sps.some(x => x.gate === g)).map(chip).join("")}${sum}${gates.filter(g => sps.some(x => x.gate === g)).map(chip).join("")}</div></div>`;
}
// A hub's card: its name (a pencil renames it, signed in), where it stands, then
// its spokes by compass sector, nearest first; past ten, a box to find a gate.
function hubCard(hub, sps){
  const d = Math.hypot(hub.x, hub.z), id = hubId(hub), me = MapCore.user();
  const free = hub.portals.filter(p => !p.to).length;
  const meta = `${plural(hub.portals.length, "gate")}${free ? ` (${free} free)` : ""} &#183; `
    + `<span class="xz">${Math.round(hub.x)}, ${Math.round(hub.z)}</span> &#183; `
    + (d < 50 ? "the world centre" : `${bearing(hub.x, hub.z)}, ${span(d)} out`);
  const one = sps.filter(s => s.kind === "link").length === 1;
  const li = s => `<li data-q="${esc((s.tag + " " + s.dst.label).toLowerCase())}"><a href="${link(s.target)}">`
    + `<span class="g">${s.kind === "dial" ? "dial " : ""}${esc(s.tag)}</span><span class="arr">&#8594;</span>`
    + `<span class="to">${esc(s.dst.label)}</span> <span>&#183; ${span(s.d)} ${s.ab}</span>`
    + `<span class="st ${s.kind === "dial" ? "dial" : "on"}">`
    + (s.kind === "dial" ? "one retag away" : one ? "dialled now" : "linked") + `</span></a></li>`;
  const bySector = new Map();
  for(const s of sps){ const k = Math.round(s.br/45) % 8; (bySector.get(k) || bySector.set(k, []).get(k)).push(s); }
  const groups = [...bySector.keys()].sort((a, b) => a - b).map(k =>
    `<li class="sector"><b>${ABBR[k]}</b>${DIRS[k]} &#183; ${bySector.get(k).length}</li>` + bySector.get(k).map(li).join("")).join("");
  const title = EDITING === id
    ? `<form class="rename" data-hub="${esc(id)}"><input class="field" name="name" maxlength="40" value="${esc(hub.given || "")}" placeholder="${esc(hub.pin || "name this hub")}" autocomplete="off">`
      + `<div class="btnrow"><button class="btn" type="submit">Save</button>${hub.given ? '<button class="btn quiet" type="button" data-clear>Back to its gates</button>' : ""}<button class="btn quiet" type="button" data-cancel>Cancel</button></div></form>`
    : `<h3><svg class="ic"><use href="#ic-portal"></use></svg><span>${esc(hub.label)}`
      + (me ? ` <a href="#" class="edit" data-rename="${esc(id)}" title="Rename this hub">&#9998;</a>` : "")
      + (hub.given && hub.tags.length ? `<span class="tags">${esc(hub.tags.join(" · "))}</span>` : "") + `</span></h3>`;
  const find = sps.length > 10 ? `<div class="find"><input class="field" type="search" data-find="${esc(id)}" placeholder="find a gate&#8230;" value="${esc(FILTER.get(id) || "")}" autocomplete="off"></div>` : "";
  return `<section class="card" data-hub="${esc(id)}">${title}<p class="meta">${meta}${hub.by ? ` &#183; named by ${esc(hub.by)}` : ""}</p>${find}`
    + (sps.length ? `<ul class="spokes">${groups}</ul>` : `<p class="empty">No gate here reaches anywhere yet.</p>`)
    + `</section>`;
}
function applyFilter(card){
  const id = card.dataset.hub, q = (FILTER.get(id) || "").trim().toLowerCase();
  card.querySelectorAll(".spokes li[data-q]").forEach(li => li.classList.toggle("hid", !!q && !li.dataset.q.includes(q)));
  card.querySelectorAll(".spokes .sector").forEach(h => {
    let n = h.nextElementSibling, any = false;
    while(n && !n.classList.contains("sector")){ if(!n.classList.contains("hid")) any = true; n = n.nextElementSibling; }
    h.classList.toggle("hid", !any);
  });
}
const listEl = document.getElementById("list");
listEl.addEventListener("input", e => {
  const inp = e.target.closest("[data-find]"); if(!inp) return;
  FILTER.set(inp.dataset.find, inp.value);
  applyFilter(inp.closest(".card"));
});
listEl.addEventListener("click", e => {
  const pen = e.target.closest("[data-rename]");
  if(pen){ e.preventDefault(); EDITING = pen.dataset.rename; LAST = ""; render(LIST); const f = listEl.querySelector(".rename input"); if(f){ f.focus(); f.select(); } return; }
  if(e.target.closest("[data-cancel]")){ EDITING = null; LAST = ""; render(LIST); return; }
  if(e.target.closest("[data-clear]")){ saveHubName(e.target.closest(".rename").dataset.hub, ""); }
});
listEl.addEventListener("submit", e => {
  const f = e.target.closest(".rename"); if(!f) return;
  e.preventDefault(); saveHubName(f.dataset.hub, f.name.value);
});
async function saveHubName(id, name){
  const note = document.getElementById("note");
  try{
    await MapCore.post(API, "/names", {id, name});
    EDITING = null; note.textContent = "";
    await load();
  }catch(err){ note.textContent = err.message || "could not save the name"; }
}

// ---------- the picked hub ----------
// With more than one hub, chips pick one: the view fits its reach and the
// others fade. Picking it again lets go.
function renderHubChips(hubs){
  const el = document.getElementById("hubs");
  el.hidden = hubs.length < 2;
  if(el.hidden){ FOCUS = null; return; }
  const html = hubs.map((h, i) => `<button class="chip${FOCUS === h ? " on" : ""}" data-hub="${i}">${esc(h.label.length > 24 ? h.label.slice(0, 22) + "…" : h.label)}<span class="n">${h.portals.length}</span></button>`).join("");
  if(el.innerHTML !== html) el.innerHTML = html;
}
document.getElementById("hubs").addEventListener("click", e => {
  const b = e.target.closest("[data-hub]"); if(!b) return;
  const h = HUBS[+b.dataset.hub];
  FOCUS = FOCUS === h ? null : h;
  renderHubChips(HUBS); applyFocus();
  if(FOCUS) fitHub(FOCUS); else fitAll();
});
function applyFocus(){
  for(const n of NODES){
    const near = !FOCUS || n.site === FOCUS || (SPOKES.some(s => (s.a === FOCUS && s.b === n.site) || (s.b === FOCUS && s.a === n.site)));
    n.el.classList.toggle("dim", !near);
  }
  draw();
}
function fitHub(hub){
  const pts = [hub].concat(SPOKES.filter(s => s.a === hub || s.b === hub).map(s => s.a === hub ? s.b : s.a));
  fitPx(pts.reduce((b, s) => ({x0: Math.min(b.x0, s.px), y0: Math.min(b.y0, s.py), x1: Math.max(b.x1, s.px), y1: Math.max(b.y1, s.py)}), {x0: 1e9, y0: 1e9, x1: -1e9, y1: -1e9}));
}

let LIST = [];
function render(list){
  LIST = list;
  const by = new Map(list.map(p => [p.id, p]));
  const twin = p => { const q = (p.to && p.to !== "0") ? by.get(p.to) : null; return (q && q.id !== p.id) ? q : null; };
  const sites = cluster(list);
  const siteOf = new Map();
  sites.forEach(s => s.portals.forEach(p => siteOf.set(p.id, s)));
  const hubs = sites.filter(s => s.portals.length > 1)
    .sort((a, b) => b.portals.length - a.portals.length || a.label.localeCompare(b.label));
  if(FOCUS){ FOCUS = hubs.find(h => Math.hypot(h.x-FOCUS.x, h.z-FOCUS.z) < HUB_R) || null; }
  HUBS = hubs;

  const pairs = [], seen = new Set();
  for(const p of list){
    if(seen.has(p.id)) continue;
    const q = twin(p);
    if(q){ seen.add(p.id); seen.add(q.id); pairs.push([p, q]); }
  }
  // A tagged portal standing unlinked is a number you can dial: a free gate
  // retagged to match will open onto it. It belongs to one hub on the atlas: the
  // only hub with a gate to spare, else the hub it last led to, else the nearest.
  const dials = list.filter(p => !twin(p) && p.name);
  const atHub = p => siteOf.get(p.id).portals.length > 1;
  const spare = hubs.filter(h => h.portals.some(p => !twin(p)));
  const nearest = (x, z, pool) => pool.reduce((b, h) => { const d = Math.hypot(h.x-x, h.z-z); return !b || d < b.d ? {h, d} : b; }, null);
  const dialHub = p => {
    if(!hubs.length) return null;
    if(spare.length === 1 && siteOf.get(p.id) !== spare[0]) return spare[0];
    if(p.last){ const n = nearest(p.last.x, p.last.z, hubs.filter(h => h !== siteOf.get(p.id))); if(n && n.d < HUB_R) return n.h; }
    const n = nearest(p.x, p.z, (spare.length ? spare : hubs).filter(h => h !== siteOf.get(p.id)));
    return n ? n.h : null;
  };
  const elsewhere = pairs.filter(([a, b]) => !atHub(a) && !atHub(b));
  const loose = list.filter(p => !twin(p) && (!p.name || !hubs.length));

  const head = (WORLD ? `<b>${esc(WORLD)}</b> &#183; ` : "") + plural(list.length, "portal")
    + ` &#183; ${plural(hubs.length, "hub")} &#183; ${plural(pairs.length, "pair")} &#183; ${loose.length} loose`;
  if(head !== LAST_HEAD){ document.getElementById("count").innerHTML = head; LAST_HEAD = head; }
  renderHubChips(hubs);

  // ---- spokes ----
  const spokes = [], touching = new Map(), hubSpokes = new Map();
  const add = s => {
    s.k = "s" + spokes.length; spokes.push(s);
    for(const site of [s.a, s.b]) (touching.get(site) || touching.set(site, []).get(site)).push(s);
  };
  for(const hub of hubs){
    const sps = [];
    for(const g of hub.portals){
      const q = twin(g); if(!q) continue;
      const dst = siteOf.get(q.id); if(dst === hub) continue;
      sps.push({kind: "link", tag: g.name || "untagged", gate: g, dst, target: g.id});
    }
    for(const p of dials){
      const dst = siteOf.get(p.id); if(dst === hub || dialHub(p) !== hub) continue;
      sps.push({kind: "dial", tag: p.name, dst, target: p.id});
    }
    for(const s of sps){
      const dx = s.dst.x - hub.x, dz = s.dst.z - hub.z;
      s.d = Math.hypot(dx, dz); s.br = deg(dx, dz); s.ab = abbr(dx, dz);
      s.a = hub; s.b = s.dst;
    }
    sps.sort((a, b) => (a.kind === b.kind ? 0 : a.kind === "link" ? -1 : 1) || a.d - b.d);
    sps.forEach(add);
    hubSpokes.set(hub, sps);
  }
  // a pair that touches no hub is its own short line, labelled at both ends
  for(const [a, b] of elsewhere){
    const A = siteOf.get(a.id), B = siteOf.get(b.id); if(A === B) continue;
    const dx = B.x - A.x, dz = B.z - A.z;
    add({kind: "pair", tag: a.name || b.name || "untagged", a: A, b: B,
         d: Math.hypot(dx, dz), br: deg(dx, dz), ab: abbr(dx, dz), target: a.id});
  }

  // ---- nodes: a panel per hub, an icon and two lines per remote place ----
  const nodes = [];
  for(const site of sites){
    const sps = touching.get(site) || [], p0 = site.portals[0];
    if(site.portals.length > 1){
      nodes.push({site, kind: "hub", pri: 0, d: 0, html: panel(site, hubSpokes.get(site) || [])});
      continue;
    }
    const ico = `<svg class="ic"><use href="#ic-portal"></use></svg>`;
    if(!sps.length){
      nodes.push({site, kind: "loose", pri: 3, d: Math.hypot(site.x, site.z), keys: [],
                  href: link(p0.id), title: p0.name || "untagged", html: ico});
      continue;
    }
    const dial = sps.every(s => s.kind === "dial");
    const o = sps[0].a === site ? sps[0].b : sps[0].a;
    const d = Math.hypot(site.x-o.x, site.z-o.z), ab = abbr(site.x-o.x, site.z-o.z);
    nodes.push({site, kind: dial ? "dial" : "rem", pri: dial ? 2 : 1, d,
      keys: sps.map(s => s.k), href: link(p0.id), title: site.pin || p0.name || "untagged",
      html: ico + `<span class="lb"><span class="t">${dial ? `<span class="dl">dial </span>` : ""}`
        + `${esc(p0.name || sps[0].tag)}</span><span class="d">${span(d)} ${ab}</span></span>`});
  }
  nodes.sort((a, b) => a.pri - b.pri || a.d - b.d);

  const netHTML = nodes.map((n, i) => n.kind === "hub"
    ? `<div class="node hub" id="n${i}">${n.html}</div>`
    : `<a class="node ${n.kind}" id="n${i}" href="${n.href}" tabindex="-1" data-s="${n.keys.join(" ")}"`
      + ` title="${esc(n.title)}">${n.html}</a>`).join("");
  const sig = netHTML + "|" + sites.map(s => Math.round(s.px) + "," + Math.round(s.py)).join(";");
  if(sig !== LAST_NET){
    LAST_NET = sig;
    net.innerHTML = netHTML;
    NODES = nodes; SPOKES = spokes; SPOKE = new Map(spokes.map(s => [s.k, s]));
    nodes.forEach((n, i) => {
      n.el = document.getElementById("n" + i);
      n.site.node = n;
      const sp = (touching.get(n.site) || [])[0];
      const o = sp ? (sp.a === n.site ? sp.b : sp.a) : null;     // a label steps away from its hub
      const dx = o ? n.site.px - o.px : 0, dy = o ? n.site.py - o.py : 1, L = Math.hypot(dx, dy) || 1;
      n.u = {x: dx/L, y: dy/L};
    });
    // a big panel's fold: click its count to open or close, remeasure, and lay out again
    net.querySelectorAll(".panel.big .gate.sum").forEach(el => el.addEventListener("click", e => {
      e.preventDefault(); const pn = el.closest(".panel"); pn.classList.toggle("open"); measure(); draw();
    }));
    measure();
    if(FOCUS) applyFocus();
    BBOX = sites.length ? sites.reduce((b, s) => ({x0: Math.min(b.x0, s.px), y0: Math.min(b.y0, s.py),
      x1: Math.max(b.x1, s.px), y1: Math.max(b.y1, s.py)}), {x0: 1e9, y0: 1e9, x1: -1e9, y1: -1e9}) : null;
    if(!FITTED && sites.length){ FITTED = true; fitAll(); } else draw();
  }

  let html = "";
  for(const hub of hubs) html += hubCard(hub, hubSpokes.get(hub) || []);
  if(hubs.length) html = `<h2 class="eyebrow section">${hubs.length === 1 ? "Hub" : "Hubs"}</h2>` + html;
  if(elsewhere.length) html += `<h2 class="eyebrow section">Elsewhere</h2><div class="rows">${elsewhere.map(row).join("")}</div>`;
  if(loose.length) html += `<h2 class="eyebrow section">Loose</h2><div class="rows">${loose.map(p => row([p])).join("")}</div>`;
  if(!list.length) html = `<p class="empty">No portals standing in this world yet.</p>`;
  // untouched DOM on the minute, so no flicker; and never under someone's typing
  if(html !== LAST && !(EDITING && LAST && listEl.querySelector(".rename"))){ listEl.innerHTML = html; LAST = html; listEl.querySelectorAll(".card[data-hub]").forEach(applyFilter); }
}

// One /state carries the portals, the pins and the fog's revision; the fog itself
// is megabytes, so it is refetched only when the server says it moved.
let FOG_REV = null, CHART_REV = null;
async function load(){
  try{
    const s = await MapCore.fetchState(API);
    PINS = MapCore.parsePins(s.pins);
    NAMED = ((s.portals || {}).named) || [];
    if(s.rev && s.rev.fog !== FOG_REV){ FOG_REV = s.rev.fog; LAY.load("fog", "/fog", FOG_REV); }
    // the chart is one image per world; its revision arrives with the state like the others
    // a server that does not yet say which chart it has still has one: ask for it by the old name
    const cr = (s.rev && s.rev.chart) || "1";
    if(cr !== CHART_REV){ CHART_REV = cr; LAY.load("chart", "/chart", CHART_REV); }
    render(((s.portals || {}).portals) || []);
    document.getElementById("note").textContent = "";
    document.getElementById("stamp").textContent = "updated " + new Date().toLocaleTimeString();
  }catch(e){
    // keep whatever is on screen: a stale atlas beats an empty one
    document.getElementById("note").textContent = "server unreachable — this atlas may be out of date";
  }
}

(async () => {
  V.fitWorld();                           // the whole world until the portals say otherwise
  LAY.loadBase();
  try{ WORLD = (await MapCore.fetchConfig(API)).world || ""; }catch(e){}
  await load();
  setInterval(() => { if(document.visibilityState === "visible") load(); }, 60000);
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") load(); });
})();
</script>
</body>
</html>
