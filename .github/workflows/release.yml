# Builds the mod on every push, and publishes to Thunderstore when a v* tag is
# pushed. Tagging is the release gate: nothing reaches Thunderstore without one.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # the game's own assemblies and BepInEx's, which cannot be committed
      - uses: ./.github/actions/game-assemblies

      - run: dotnet tool restore

      - name: Build and package
        run: ./package.sh

      # A tag that disagrees with the manifest would publish the wrong version
      # under the right name, which cannot be undone on Thunderstore.
      - name: Check the tag matches the manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(python3 -c "import json;print(json.load(open('manifest.json'))['version_number'])")
          TAG="${GITHUB_REF_NAME#v}"
          [ "$V" = "$TAG" ] || { echo "manifest is $V but the tag is $TAG"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: WebMap-package
          path: dist/WebMap-*.zip

      - name: Publish to Thunderstore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "THUNDERSTORE_TOKEN is not set"; exit 1; }
          V=$(python3 -c "import json;print(json.load(open('manifest.json'))['version_number'])")
          # no --package-version with --file: tcli rejects the pair, and the version
          # comes from the manifest.json inside the zip anyway
          dotnet tcli publish --file "dist/WebMap-$V.zip" --token "$TOKEN"
