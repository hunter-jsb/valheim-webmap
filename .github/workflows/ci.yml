# Every push to a branch and every pull request: the mod builds and packages as a
# tag would publish it (a C# warning fails it), its logic passes dotnet test, and the
# viewer passes its lint and its core node --test. A tag is release.yml's alone. The
# end-to-end checks want a live server and a Chrome, so they stay a step run by hand
# (tools/check.mjs).
name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: ./.github/actions/game-assemblies

      - name: Build and package
        run: ./package.sh

      - name: dotnet test
        run: dotnet test WebMap.Tests

      - name: lint
        run: |
          npm ci
          npm run lint

      - name: node --test
        run: node --test
